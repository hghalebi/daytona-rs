name: SDK contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy (including tests and examples)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Domain, protocol, recovery, and policy fixtures
        run: cargo test --workspace --all-targets --locked
      - name: Run local teaching examples
        run: |
          cargo run --example validate_inputs --locked
          DAYTONA_API_KEY=documentation-example cargo run --example configure_client --locked
          cargo run --example preserve_work --locked
      - name: Consumer compile contracts
        run: cargo test --doc --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked
      - name: Install source policy executable
        run: cargo install --path tools/source-policy --root target/policy --locked
      - name: Check all owned Rust sources with installed executable
        run: target/policy/bin/source-policy .
      - name: Check that environment files cannot enter the crate
        shell: bash
        run: |
          set -o noclobber
          printf '%s\n' 'DAYTONA_API_KEY=package-exclusion-fixture' > src/.env.package-fixture
          trap 'rm -f src/.env.package-fixture' EXIT
          package_files=$(cargo package -p daytona-rs --list --locked)
          if printf '%s\n' "$package_files" | grep -E '(^|/)\.env($|\.)'; then
            exit 1
          fi
      - name: Build the release archive
        run: cargo package -p daytona-rs --locked
      - name: Verify the crates.io package without uploading
        run: cargo publish -p daytona-rs --registry crates-io --dry-run --locked
      - name: Test the packaged SDK independently of workspace members
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "daytona-rs"))')
          package_dir="target/package/daytona-rs-${version}"
          cargo test --manifest-path "${package_dir}/Cargo.toml" --all-targets --locked
          cargo test --manifest-path "${package_dir}/Cargo.toml" --doc --locked
          RUSTDOCFLAGS='-D warnings' cargo doc --manifest-path "${package_dir}/Cargo.toml" --no-deps --locked

      - name: Verify exported macros with a renamed external dependency
        shell: bash
        run: |
          consumer_dir=$(mktemp -d)
          mkdir -p "$consumer_dir/src"
          cp tests/consumer/fixture.rs "$consumer_dir/src/main.rs"
          cat > "$consumer_dir/Cargo.toml" <<EOF
          [package]
          name = "daytona-consumer"
          version = "0.0.0"
          edition = "2024"
          [dependencies]
          sdk = { package = "daytona-rs", path = "$GITHUB_WORKSPACE" }
          thiserror = "2"
          EOF
          cargo run --manifest-path "$consumer_dir/Cargo.toml"
